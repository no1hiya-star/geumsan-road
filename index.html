<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>차량길잡이</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="차량길잡이" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #mapWrap {
      position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden;
    }
    #map {
      position: absolute; left: 50%; top: 50%;
      width: 150vmax; height: 150vmax;
      margin-left: -75vmax; margin-top: -75vmax;
      transform-origin: 50% 50%; transition: transform .15s linear; will-change: transform;
    }
    #banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1100;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
      font: 700 18px/1.3 sans-serif; text-align: center; color: #fff;
      background: #475569; transition: background .2s;
    }
    #banner small { display: block; font-weight: 400; font-size: 13px; opacity: .92; margin-top: 2px; }
    #banner.ok { background: #334155; }
    #banner.warn { background: #ca8a04; }
    #banner.caution { background: #16a34a; }
    #banner.danger { background: #dc2626; }
    #bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100;
      display: flex; gap: 8px; padding: 8px 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
      background: rgba(255,255,255,.95); box-shadow: 0 -1px 6px rgba(0,0,0,.25);
      flex-wrap: wrap; align-items: center; font-size: 13px;
    }
    #bar button, #bar select {
      font-size: 15px; padding: 10px 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; background: #fff;
    }
    #bar button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
    #vehicleSelect { font-weight: 700; color: #0f172a; border-color: #94a3b8; }
    #soundSlot { display: none; }
    #legend {
      position: fixed; right: 8px; bottom: 150px; z-index: 1050;
      background: #fff; padding: 8px 10px; line-height: 1.6; border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,.25); font-size: 12px;
    }
    #legend i { display: inline-block; width: 18px; height: 4px; margin-right: 6px; vertical-align: middle; }
    #searchRow { display: flex; gap: 6px; width: 100%; }
    #q { flex: 1; min-width: 0; font-size: 16px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
    #results {
      position: absolute; left: 0; right: 0; bottom: 100%; max-height: 40vh; overflow: auto;
      background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,.25); display: none;
    }
    #results .item { padding: 11px 14px; border-bottom: 1px solid #e2e8f0; font-size: 15px; cursor: pointer; }
    #results .item small { display: block; color: #64748b; font-size: 12px; margin-top: 2px; }
    #results .empty { padding: 14px; color: #64748b; font-size: 14px; }
    #windy { position: fixed; inset: 0; z-index: 1300; background: #0f172a; display: none; flex-direction: column; }
    #windy .top { display: flex; gap: 8px; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px; color: #fff; font-size: 14px; }
    #windy .top span { flex: 1; font-weight: 700; }
    #windy select, #windy button { font-size: 15px; padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; }
    #windy iframe { flex: 1; border: 0; width: 100%; }
    .turn-marker {
      display: flex; flex-direction: column; align-items: center;
      transform-origin: 50% 50%; pointer-events: auto; cursor: pointer;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.45));
    }
    .turn-marker .badge {
      margin-top: 2px; padding: 2px 6px; border-radius: 4px;
      background: rgba(15,23,42,.92); color: #fff; font: 700 11px/1.2 sans-serif;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="banner">지도 불러오는 중...<small></small></div>
  <div id="mapWrap"><div id="map"></div></div>
  <div id="legend">
    <b>도로 폭</b><br>
    <i style="background:#e11d48"></i>위험 (2m 이하)<br>
    <i style="background:#eab308"></i>경계 (3m 이하)<br>
    <i style="background:#16a34a"></i>관심 (4m 이하)
  </div>
  <div id="bar">
    <div id="results"></div>
    <div id="searchRow">
      <input id="q" type="search" placeholder="주소 또는 장소 검색 (예: 금산군청)" />
      <button id="searchBtn">검색</button>
    </div>
    <select id="vehicleSelect" aria-label="차종 선택">
      <option value="">차종 미선택</option>
      <option value="carf">카프차 (1.75m)</option>
      <option value="amb">구급차 (2.00m)</option>
      <option value="small">소형펌프 (2.10m)</option>
      <option value="mid">중형 (2.45m)</option>
      <option value="large">대형급 (2.50m)</option>
    </select>
    <button id="followBtn" class="on">내 위치 따라가기</button>
    <button id="satBtn">🛰 위성</button>
    <button id="facBtn" class="on">🧯 용수시설</button>
    <span id="soundSlot" data-reserved="sound-control"></span>
    <button id="windBtn">🌬 기상</button>
  </div>

  <div id="windy">
    <div class="top">
      <span>Windy 기상</span>
      <select id="windOv">
        <option value="wind">바람</option>
        <option value="rain">비</option>
        <option value="temp">기온</option>
        <option value="clouds">구름</option>
      </select>
      <button id="windClose">닫기</button>
    </div>
    <iframe id="windFrame" title="Windy"></iframe>
  </div>

    } else {

      s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_KEY) + '&autoload=false&libraries=services';
      s.onload = () => kakao.maps.load(initMap);
      s.onerror = () => setBanner('danger', '카카오맵을 불러오지 못했어요', '키·도메인 등록·카카오맵 사용 설정(ON)을 확인하세요', true);
      document.head.appendChild(s);
    }

    function initMap() {
      const startPos = loadSavedPos() || { lat: 36.107, lng: 127.488 };
      map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(startPos.lat, startPos.lng), level: 4
      });
      setTimeout(() => { if (map) map.relayout(); }, 150);
      map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      infoWin = new kakao.maps.InfoWindow({ removable: true, zIndex: 20 });
      kakao.maps.event.addListener(map, 'idle', () => { updateVisible(); updateFacilities(); });
      kakao.maps.event.addListener(map, 'dragstart', () => {
        followOn = false; document.getElementById('followBtn').classList.remove('on');
      });
      setBanner('', '지도 준비됨', '위치와 도로 데이터를 불러오는 중...', true);
      if (location.protocol.startsWith('http')) {
        fetch('./index.json').then(r => r.ok ? r.json() : null).then(j => {
          if (!j) { setBanner('danger', '도로 데이터 목록을 못 받았어요', '인터넷 연결을 확인해 주세요', true); return; }
          tileIndex = j;
          updateVisible();
          if (lastPos) {
            ensureTilesForBox(lastPos[1] - TILE_EDGE, lastPos[0] - TILE_EDGE, lastPos[1] + TILE_EDGE, lastPos[0] + TILE_EDGE);
            checkAhead(lastPos[0], lastPos[1], lastFix.accuracy, lastFix.speed);
          }
        }).catch(() => setBanner('danger', '도로 데이터 목록을 못 받았어요', '인터넷 연결을 확인해 주세요', true));
      }
      loadFacilities();
      startTracking();
    }

    // ===== 도로선 스타일 (차종 선택과 무관하게 도로폭 기준 고정 유지) =====
    function styleOf(bt) {
      if (isNaN(bt)) return { color: '#7c3aed', weight: 3, style: 'shortdash' };
      const t = tierOf(bt);
      if (t === 'danger') return { color: '#e11d48', weight: 5, style: 'solid' };
      if (t === 'warn')   return { color: '#eab308', weight: 4.5, style: 'solid' };
      return { color: '#16a34a', weight: 4, style: 'solid' };
    }

    // ===== 지역별 타일 불러오기 =====
    const TILE = 0.2, TILE_EDGE = 0.03;
    let tileIndex = null;
    let lastFix = { accuracy: 0, speed: null };
    const tileState = new Map();
    const seenIds = new Set();

    function tileKey(lng, lat) { return Math.floor(lng / TILE) + '_' + Math.floor(lat / TILE); }

    function ensureTilesForBox(w, s, e, n) {
      if (!tileIndex) return;
      for (let ix = Math.floor(w / TILE); ix <= Math.floor(e / TILE); ix++) {
        for (let iy = Math.floor(s / TILE); iy <= Math.floor(n / TILE); iy++) loadTile(ix + '_' + iy);
      }
    }

    async function loadTile(key) {
      if (!tileIndex || !tileIndex.tiles[key] || tileState.has(key)) return;
      tileState.set(key, 'loading');
      try {
        const res = await fetch('./t_' + key + '.json');
        if (!res.ok) throw new Error('http ' + res.status);
        addTile(await res.json());
        tileState.set(key, 'done');
      } catch (err) {
        tileState.set(key, 'fail');
        setTimeout(() => tileState.delete(key), 20000);
      }
      if (!lastPos) setBanner('', '도로 데이터 불러옴', `주변 도로 ${seenIds.size.toLocaleString()}개`, true);
      updateVisible();
      if (lastPos) checkAhead(lastPos[0], lastPos[1], lastFix.accuracy, lastFix.speed);
    }

    function addTile(data) {
      (data.f || []).forEach(f => {
        if (seenIds.has(f.i)) return;
        seenIds.add(f.i);
        const bt = Number(f.b);
        f.c.forEach(line => {
          let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
          line.forEach(([x, y]) => {
            if (y < minLat) minLat = y; if (y > maxLat) maxLat = y;
            if (x < minLng) minLng = x; if (x > maxLng) maxLng = x;
          });
          items.push({ line, bt, rn: f.n, rbp: f.r, bbox: [minLat, minLng, maxLat, maxLng], pl: null, shown: false });
          addLineToGrid(line, bt, f.n || '이름 없음', f.i);
        });
      });
    }

    function updateVisible() {
      if (!map) return;
      const level = map.getLevel();
      const draw = level <= DRAW_MAX_LEVEL;
      const b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
      const padLat = (ne.getLat() - sw.getLat()) * 0.2, padLng = (ne.getLng() - sw.getLng()) * 0.2;
      const s = sw.getLat() - padLat, n = ne.getLat() + padLat, w = sw.getLng() - padLng, e = ne.getLng() + padLng;
      if (draw) ensureTilesForBox(w, s, e, n);
      if (items.length === 0) return;
      items.forEach(it => {
        const [a1, b1, a2, b2] = it.bbox;
        const inView = draw && !(a2 < s || a1 > n || b2 < w || b1 > e);
        if (inView && !it.shown) {
          if (!it.pl) {
            const st = styleOf(it.bt);
            it.pl = new kakao.maps.Polyline({
              path: it.line.map(([x, y]) => new kakao.maps.LatLng(y, x)),
              strokeWeight: st.weight, strokeColor: st.color, strokeOpacity: 0.95, strokeStyle: st.style
            });
            kakao.maps.event.addListener(it.pl, 'click', ev => {
              const v = VEHICLES[selectedVehicleKey];
              const vLine = v && !isNaN(it.bt)
                ? `<br>여유 폭(${v.name}): <b>${(it.bt - v.width).toFixed(2)} m</b>`
                : '';
              infoWin.setContent(`<div style="padding:6px 8px;font-size:12px;">` +
                `<b>${it.rn || '도로명 없음'}</b><br>도로폭: <b>${isNaN(it.bt) ? '정보 없음' : it.bt + ' m'}</b>${vLine}<br>${it.rbp || ''}</div>`);
              infoWin.setPosition(ev.latLng);
              infoWin.open(map);
            });
          }
          it.pl.setMap(map); it.shown = true;
        } else if (!inView && it.shown) {
          it.pl.setMap(null); it.shown = false;
        }
      });
    }

    // ===== 거리/방향 계산 =====
    const R = 6371000, toRad = x => x * Math.PI / 180;
    function dist(lat1, lng1, lat2, lng2) {
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }
    function bearing(lat1, lng1, lat2, lng2) {
      const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    function angDiff(a, b) { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }

    // ===== 검색용 격자 + 노드 위상 그래프 =====
    const nodeMap = new Map();
    function ptKey(lng, lat) { return lng.toFixed(5) + ',' + lat.toFixed(5); }

    function registerNodeEdge(key, edge) {
      let list = nodeMap.get(key);
      if (!list) { list = []; nodeMap.set(key, list); }
      list.push(edge);
    }

    function addLineToGrid(line, bt, rn, featId) {
      for (let i = 0; i < line.length - 1; i++) {
        const x1 = line[i][0], y1 = line[i][1], x2 = line[i + 1][0], y2 = line[i + 1][1];
        if (x1 === x2 && y1 === y2) continue;
        const k1 = ptKey(x1, y1), k2 = ptKey(x2, y2);
        const dir12 = bearing(y1, x1, y2, x2);
        const dir21 = bearing(y2, x2, y1, x1);

        registerNodeEdge(k1, { toKey: k2, outDir: dir12, featId, bt, rn });
        registerNodeEdge(k2, { toKey: k1, outDir: dir21, featId, bt, rn });

        const seg = { x1, y1, x2, y2, k1, k2, dir12, dir21, bt, rn, featId };
        const cx1 = Math.floor(Math.min(x1, x2) / CELL), cx2 = Math.floor(Math.max(x1, x2) / CELL);
        const cy1 = Math.floor(Math.min(y1, y2) / CELL), cy2 = Math.floor(Math.max(y1, y2) / CELL);
        for (let cy = cy1; cy <= cy2; cy++) for (let cx = cx1; cx <= cx2; cx++) {
          const key = cy + '_' + cx;
          let arr = grid.get(key);
          if (!arr) { arr = []; grid.set(key, arr); }
          arr.push(seg);
        }
      }
    }

    function analyzeNodeAhead(nodeLng, nodeLat, arriveBearing) {
      const key = ptKey(nodeLng, nodeLat);
      const edges = nodeMap.get(key) || [];
      const revDir = (arriveBearing + 180) % 360;
      const others = edges.filter(e => angDiff(e.outDir, revDir) > 12);

      const modLng = ((nodeLng % TILE) + TILE) % TILE;
      const modLat = ((nodeLat % TILE) + TILE) % TILE;
      const nearTileBorder = (modLng < 0.00018 || (TILE - modLng) < 0.00018 || modLat < 0.00018 || (TILE - modLat) < 0.00018);

      if (others.length === 0) {
        if (nearTileBorder) return null;
        return { kind: 'deadend', turnDeg: 180 };
      }

      let minTurn = 180;
      for (const e of others) {
        const turn = Math.round(angDiff(arriveBearing, e.outDir));
        if (turn < minTurn) minTurn = turn;
      }
      if (minTurn >= CORNER_MIN_DEG) {
        return { kind: 'corner', turnDeg: minTurn };
      }
      return null;
    }

    function nearbySegs(lat, lng, radiusM) {
      const ky = 110540, kx = 111320 * Math.cos(toRad(lat));
      const ry = Math.ceil(radiusM / ky / CELL) + 1, rx = Math.ceil(radiusM / kx / CELL) + 1;
      const cy = Math.floor(lat / CELL), cx = Math.floor(lng / CELL);
      const seen = new Set(), out = [];
      for (let dy = -ry; dy <= ry; dy++) for (let dx = -rx; dx <= rx; dx++) {
        const arr = grid.get((cy + dy) + '_' + (cx + dx));
        if (arr) for (const sg of arr) if (!seen.has(sg)) { seen.add(sg); out.push(sg); }
      }
      return out;
    }

    function segDist(sg, lat, lng, kx, ky) {
      const ax = (sg.x1 - lng) * kx, ay = (sg.y1 - lat) * ky, bx = (sg.x2 - lng) * kx, by = (sg.y2 - lat) * ky;
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      let t = len2 > 0 ? -(ax * dx + ay * dy) / len2 : 0;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(ax + t * dx, ay + t * dy);
    }

    // ===== 전방 핵심 지점 삼각형 마커 (최대 1개) =====
    function makeHazardEl(label, color) {
      const wrap = document.createElement('div');
      wrap.className = 'turn-marker';
      wrap.style.transform = 'rotate(' + mapRotation + 'deg)';
      wrap.innerHTML =
        `<svg width="32" height="28" viewBox="0 0 32 28" aria-hidden="true">` +
          `<polygon points="16,2 30,26 2,26" fill="${color}" stroke="#ffffff" stroke-width="2.5"/>` +
          `<text x="16" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">!</text>` +
        `</svg>` +
        `<div class="badge">${label}</div>`;
      return wrap;
    }

    function showHazardMarker(lat, lng, badgeText, infoHtml, isSevere) {
      if (!map) return;
      const pos = new kakao.maps.LatLng(lat, lng);
      const color = isSevere ? '#dc2626' : '#ca8a04';
      const el = makeHazardEl(badgeText, color);
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        infoWin.setContent(infoHtml);
        infoWin.setPosition(pos);
        infoWin.open(map);
      });
      if (!hazardOverlay) {
        hazardOverlay = new kakao.maps.CustomOverlay({
          position: pos, xAnchor: 0.5, yAnchor: 0.85, zIndex: 15, content: el
        });
        hazardOverlay.setMap(map);
      } else {
        hazardOverlay.setPosition(pos);
        hazardOverlay.setContent(el);
        if (!hazardOverlay.getMap()) hazardOverlay.setMap(map);
      }
      hazardEl = el;
    }

    function clearHazardMarker() {
      if (hazardOverlay) hazardOverlay.setMap(null);
      hazardEl = null;
    }

    // ===== 위치 추적 + 네비게이션 헤드업 지도 회전 & 차량 진행방향 정면 고정 =====
    const SAVE_KEY = 'charyang_lastPos';
    function loadSavedPos() {
      try {
        const j = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (j && isFinite(j.lat) && isFinite(j.lng)) return j;
      } catch (e) {}
      return null;
    }
    function savePos(lat, lng) {
      const now = Date.now();
      if (now - lastSave < 5000) return;
      lastSave = now;
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({ lat, lng, t: now })); } catch (e) {}
    }
    function blendAngle(a, b, w) {
      const d = ((b - a + 540) % 360) - 180;
      return (a + d * w + 360) % 360;
    }
    function makeTruck() {
      const wrap = document.createElement('div');
      // ICON_TRUCK 원본 이미지 머리가 우측(동쪽, 0deg) 기준이므로 -90deg 적용 시 지도 좌표계 북쪽(0deg)을 향함
      wrap.style.cssText = 'width:48px;height:48px;transform-origin:50% 50%;transform:rotate(-90deg);filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));';
      const img = document.createElement('img');
      img.src = ICON_TRUCK; img.width = 48; img.height = 48; img.style.display = 'block';
      wrap.appendChild(img);
      return wrap;
    }

    // 지도를 진행 방향(h)만큼 역회전(-mapRotation)시켜 진행 방향이 항상 화면 12시(위쪽)가 되게 함
    function applyHeadingUpMap(h) {
      const mapEl = document.getElementById('map');
      if (!mapEl || h === null || h === undefined || isNaN(h)) return;
      mapRotation += ((h - mapRotation + 540) % 360) - 180;
      mapEl.style.transform = 'rotate(' + (-mapRotation) + 'deg)';
      facMarkers.forEach(o => {
        if (o.el) o.el.style.transform = 'rotate(' + mapRotation + 'deg)';
      });
      if (hazardEl) hazardEl.style.transform = 'rotate(' + mapRotation + 'deg)';
      if (truckEl) truckEl.style.transform = 'rotate(' + ((h - mapRotation) - 90) + 'deg)';
    }

    function onPosition(pos) {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      const now = pos.timestamp || Date.now();
      let spd = pos.coords.speed;
      if (spd === null || spd === undefined || isNaN(spd)) {
        spd = 0;
        if (prevFix) {
          const dt = (now - prevFix.t) / 1000;
          if (dt > 0.3 && dt < 10) spd = dist(prevFix.lat, prevFix.lng, lat, lng) / dt;
        }
      }
      if (spd >= 1.5) {
        let h = pos.coords.heading;
        if ((h === null || h === undefined || isNaN(h)) && prevFix && dist(prevFix.lat, prevFix.lng, lat, lng) > 2) {
          h = bearing(prevFix.lat, prevFix.lng, lat, lng);
        }
        if (h !== null && h !== undefined && !isNaN(h)) curHeading = curHeading === null ? h : blendAngle(curHeading, h, 0.85);
      }
      prevFix = { lat, lng, t: now };
      lastPos = [lat, lng];

      if (map) {
        const ll = new kakao.maps.LatLng(lat, lng);
        if (!gpsOverlay) {
          truckEl = makeTruck();
          gpsOverlay = new kakao.maps.CustomOverlay({ position: ll, xAnchor: 0.5, yAnchor: 0.5, zIndex: 10, content: truckEl });
          gpsOverlay.setMap(map);
          gpsCircle = new kakao.maps.Circle({
            map, center: ll, radius: accuracy, strokeWeight: 1, strokeColor: '#2563eb',
            strokeOpacity: 0.8, fillColor: '#2563eb', fillOpacity: 0.1
          });
          map.setCenter(ll); map.setLevel(3);
        } else {
          gpsOverlay.setPosition(ll);
          gpsCircle.setPosition(ll); gpsCircle.setRadius(accuracy);
        }
        if (curHeading !== null) applyHeadingUpMap(curHeading);
        if (followOn) map.panTo(ll);
      }
      lastFix = { accuracy, speed: spd };
      savePos(lat, lng);
      ensureTilesForBox(lng - TILE_EDGE, lat - TILE_EDGE, lng + TILE_EDGE, lat + TILE_EDGE);
      checkAhead(lat, lng, accuracy, spd);
    }

    // ===== 전방 판정 =====
    function checkAhead(lat, lng, accuracy, speedMs) {
      if (!tileIndex) { setBanner('', '도로 데이터 불러오는 중', '잠시만 기다려 주세요'); return; }
      const tk = tileKey(lng, lat);
      if (!tileIndex.tiles[tk]) { clearHazardMarker(); setBanner('', '이 지역은 도로 데이터가 없어요', '충남 밖이거나 4m 이하 도로가 없는 지역이에요'); return; }
      if (tileState.get(tk) === 'fail') { clearHazardMarker(); setBanner('danger', '도로 데이터를 못 받았어요', '인터넷 연결을 확인해 주세요 (잠시 후 다시 시도)'); return; }
      if (tileState.get(tk) !== 'done') { setBanner('', '도로 데이터 불러오는 중', '잠시만 기다려 주세요'); return; }

      const v = VEHICLES[selectedVehicleKey] || null;
      const ky = 110540, kx = 111320 * Math.cos(toRad(lat));
      const moving = speedMs >= MOVING_MS;
      const fast = speedMs * 3.6 >= FAST_KMH;
      const segs = nearbySegs(lat, lng, AHEAD_DIST + CORRIDOR_M);

      let nearest = null, nd = Infinity;
      segs.forEach(sg => { const d = segDist(sg, lat, lng, kx, ky); if (d < nd) { nd = d; nearest = sg; } });

      let ahead = null, ad = Infinity, aRank = 99;
      let bestSpot = null;

      if (moving && curHeading !== null) {
        const th = toRad(curHeading), fx = Math.sin(th), fy = Math.cos(th), rx = Math.cos(th), ry = -Math.sin(th);
        const hMod = curHeading % 180;

        segs.forEach(sg => {
          const ax = (sg.x1 - lng) * kx, ay = (sg.y1 - lat) * ky, bx = (sg.x2 - lng) * kx, by = (sg.y2 - lat) * ky;
          const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
          if (len === 0) return;

          let da = Math.abs(((Math.atan2(dx, dy) * 180 / Math.PI + 360) % 180) - hMod);
          if (da > 90) da = 180 - da;
          if (da > ALIGN_DEG) return;

          const rank = TIERS[tierOf(sg.bt)].rank;
          const n = Math.max(1, Math.ceil(len / SAMPLE_M));
          for (let i = 0; i <= n; i++) {
            const px = ax + dx * i / n, py = ay + dy * i / n;
            const along = px * fx + py * fy;
            if (along < AHEAD_MIN || along > AHEAD_DIST) continue;
            if (Math.abs(px * rx + py * ry) > CORRIDOR_M) continue;
            if (rank < aRank || (rank === aRank && along < ad)) { ahead = sg; ad = along; aRank = rank; }
          }

          if (v) {
            const forward12 = angDiff(curHeading, sg.dir12) <= 90;
            const endX = forward12 ? sg.x2 : sg.x1;
            const endY = forward12 ? sg.y2 : sg.y1;
            const arriveDir = forward12 ? sg.dir12 : sg.dir21;
            const ex = (endX - lng) * kx, ey = (endY - lat) * ky;
            const alongEnd = ex * fx + ey * fy;
            const lateralEnd = Math.abs(ex * rx + ey * ry);

            if (alongEnd >= AHEAD_MIN && alongEnd <= AHEAD_DIST && lateralEnd <= CORRIDOR_M) {
              const info = analyzeNodeAhead(endX, endY, arriveDir);
              if (info) {
                const isDeadEnd = info.kind === 'deadend';
                const needRadius = isDeadEnd
                  ? v.minRadius
                  : +(v.minRadius * (info.turnDeg / 90)).toFixed(1);
                const spotType = isDeadEnd ? '막다른 길 끝점' : `급코너 ${info.turnDeg}°`;
                const severe = isDeadEnd || (!isNaN(sg.bt) && sg.bt < v.width);
                if (!bestSpot || alongEnd < bestSpot.dist) {
                  bestSpot = {
                    lat: endY, lng: endX, dist: alongEnd,
                    type: spotType, bt: sg.bt, rn: sg.rn,
                    needRadius, severe
                  };
                }
              }
            }
          }
        });
      }

      if (v && bestSpot) {
        const badge = `${Math.round(bestSpot.dist)}m · ${bestSpot.type}`;
        const btTxt = isNaN(bestSpot.bt) ? '정보 없음' : `${bestSpot.bt.toFixed(1)}m`;
        const infoHtml =
          `<div style="padding:8px 10px;font-size:12px;line-height:1.5;">` +
          `<b>${bestSpot.type}</b> (${bestSpot.rn})<br>` +
          `도로폭: <b>${btTxt}</b> · ${v.name} 폭: <b>${v.width.toFixed(2)}m</b><br>` +
          `필요 회전반경 참고: <b>${bestSpot.needRadius.toFixed(1)}m</b>` +
          `</div>`;
        showHazardMarker(bestSpot.lat, bestSpot.lng, badge, infoHtml, bestSpot.severe);
      } else {
        clearHazardMarker();
      }

      const accNote = accuracy > 30 ? ` · GPS 오차 ${Math.round(accuracy)}m` : '';
      const onRoad = nearest && nd <= ON_ROAD_DIST;

      if (v) {
        if (bestSpot) {
          const cls = bestSpot.severe ? 'danger' : 'warn';
          const btStr = isNaN(bestSpot.bt) ? '폭 미상' : `도로폭 ${bestSpot.bt.toFixed(1)}m`;
          setBanner(
            cls,
            `전방 ${Math.round(bestSpot.dist)}m · ${bestSpot.type} (회전반경 ${bestSpot.needRadius.toFixed(1)}m)`,
            `${v.name} ${v.width.toFixed(2)}m · ${btStr} · ${bestSpot.rn}${accNote}`
          );
          onAlertTrigger(cls, bestSpot.type, 'spot_' + bestSpot.rn);
          return;
        }

        const targetSeg = (onRoad && !fast) ? nearest : ahead;
        if (targetSeg && !isNaN(targetSeg.bt)) {
          const margin = +(targetSeg.bt - v.width).toFixed(2);
          const marginTxt = margin >= 0 ? `여유 +${margin.toFixed(2)}m` : `차이 ${margin.toFixed(2)}m`;
          const prefix = (onRoad && !fast) ? '현재' : `전방 ${Math.round(ad)}m`;
          const cls = margin < 0 ? 'danger' : (margin < 0.5 ? 'warn' : 'caution');
          setBanner(
            cls,
            `${prefix} 도로폭 ${targetSeg.bt.toFixed(1)}m · ${marginTxt}`,
            `${v.name} 폭 ${v.width.toFixed(2)}m · ${targetSeg.rn}${accNote}`
          );
          onAlertTrigger(cls, marginTxt, 'seg_' + targetSeg.rn);
          return;
        }

        setBanner(
          'ok',
          `${v.name} (${v.width.toFixed(2)}m) · 전방 ${AHEAD_DIST}m 내 특이구간 없음`,
          `최소 회전반경 참고 ${v.minRadius.toFixed(1)}m${accNote}`
        );
        return;
      }

      if (onRoad && !fast) {
        const k = tierOf(nearest.bt), t = TIERS[k];
        setBanner(k, `${t.mark}${t.name} 구간 · 도로폭 ${isNaN(nearest.bt) ? t.range : nearest.bt.toFixed(1) + 'm'}`, `${nearest.rn}${accNote}`);
      } else if (ahead) {
        const k = tierOf(ahead.bt), t = TIERS[k];
        setBanner(k, `전방 ${Math.round(ad)}m · ${t.name} 구간 (${isNaN(ahead.bt) ? t.range : ahead.bt.toFixed(1) + 'm'})`, `${ahead.rn}${accNote}`);
      } else {
        setBanner('ok', `전방 ${AHEAD_DIST}m 내 4m 이하 좁은 도로 없음`, accNote.replace(' · ', ''));
      }
    }

    // ===== 용수시설: 소화전·비상소화장치 =====
    const FAC_MAX_LEVEL = 5;
    function infoBox(props, label) {
      const box = document.createElement('div');
      box.style.cssText = 'padding:10px 12px;font-size:13px;line-height:1.55;min-width:220px;max-width:290px;box-sizing:border-box;word-break:break-word;';
      const addLine = (text, bold) => {
        const d = document.createElement(bold ? 'b' : 'div'); d.textContent = text; box.appendChild(d);
        if (bold) box.appendChild(document.createElement('br'));
      };
      addLine(props.name || label, true);
      addLine(label + (props.facility_type ? ' · ' + props.facility_type : '') + (props.taken_over === false ? ' · 미인수' : ''));
      const addr = props.address_road || props.address_jibun;
      if (addr) addLine(addr);
      if (props.station) addLine('관할: ' + props.station);
      const spec = [];
      if (props.pressure_kgcm2 !== null && props.pressure_kgcm2 !== undefined) spec.push('수압 ' + props.pressure_kgcm2 + 'kg/cm²');
      if (props.pipe_diameter_mm !== null && props.pipe_diameter_mm !== undefined) spec.push('관경 ' + props.pipe_diameter_mm + 'mm');
      if (spec.length) addLine(spec.join(' · '));
      if (props.remark) addLine('비고: ' + props.remark);
      return box;
    }
    function makeFacEl(icon) {
      const el = document.createElement('div');
      el.style.cssText = 'width:30px;height:30px;transform-origin:50% 50%;transform:rotate(' + mapRotation + 'deg);cursor:pointer;';
      const img = document.createElement('img');
      img.src = icon; img.width = 30; img.height = 30; img.style.display = 'block';
      el.appendChild(img);
      return el;
    }
    function loadFacilities() {
      if (!location.protocol.startsWith('http')) return;
      [['./hydrants_1.geojson', ICON_HYDRANT, '소화전'], ['./emergency_devices_1.geojson', ICON_DEVICE, '비상소화장치']].forEach(([url, icon, label]) => {
        fetch(url).then(r => r.ok ? r.json() : null).then(d => {
          if (!d) return;
          (d.features || []).forEach(f => {
            if (!f.geometry || f.geometry.type !== 'Point') return;
            const [x, y] = f.geometry.coordinates;
            const pos = new kakao.maps.LatLng(y, x);
            const el = makeFacEl(icon);
            const m = new kakao.maps.CustomOverlay({ position: pos, xAnchor: 0.5, yAnchor: 0.5, zIndex: 5, content: el });
            el.addEventListener('click', ev => {
              ev.stopPropagation();
              infoWin.setContent(infoBox(f.properties || {}, label));
              infoWin.setPosition(pos);
              infoWin.open(map);
            });
            facMarkers.push({ m, el, shown: false });
          });
          updateFacilities();
        }).catch(() => {});
      });
    }
    function updateFacilities() {
      if (!map) return;
      const show = facOn && map.getLevel() <= FAC_MAX_LEVEL;
      facMarkers.forEach(o => {
        if (o.el) o.el.style.transform = 'rotate(' + mapRotation + 'deg)';
        if (show && !o.shown) { o.m.setMap(map); o.shown = true; }
        else if (!show && o.shown) { o.m.setMap(null); o.shown = false; }
      });
    }

    function startWatch(high) {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(onPosition, err => {
        if (err.code === 1) {
          setBanner('danger', '위치 권한이 꺼져 있어요', '브라우저 주소창 옆 설정과 폰의 위치 설정에서 허용해 주세요', true);
          return;
        }
        if (high) {
          setBanner('', '정밀 GPS 대기 중...', '실내에서는 정확도가 낮아요. 일반 위치로 시도합니다', true);
          startWatch(false);
          return;
        }
        setBanner('danger', '위치를 못 가져왔어요', (err.code === 2 ? '이 기기에서 위치를 알 수 없음' : '시간 초과') + ' (' + err.message + ')', true);
      }, { enableHighAccuracy: high, maximumAge: 1000, timeout: high ? 10000 : 20000 });
    }

    // ===== 주소/장소 검색 =====
    let destMarker = null;
    const resultsEl = document.getElementById('results');

    function runSearch() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      if (!map || !(kakao.maps && kakao.maps.services)) { alert('지도가 아직 준비되지 않았어요.'); return; }
      const St = kakao.maps.services.Status;
      const list = [];
      let pending = 2;
      const done = () => { if (--pending === 0) showResults(list); };

      new kakao.maps.services.Geocoder().addressSearch(q, (res, status) => {
        if (status === St.OK) res.slice(0, 5).forEach(r => list.push({
          name: r.address_name,
          sub: (r.road_address && r.road_address.address_name !== r.address_name) ? r.road_address.address_name : '주소',
          x: Number(r.x), y: Number(r.y)
        }));
        done();
      });
      new kakao.maps.services.Places().keywordSearch(q, (res, status) => {
        if (status === St.OK) res.slice(0, 8).forEach(r => list.push({
          name: r.place_name, sub: r.road_address_name || r.address_name, x: Number(r.x), y: Number(r.y)
        }));
        done();
      }, { location: map.getCenter(), size: 8 });
    }

    function showResults(list) {
      const seen = new Set();
      list = list.filter(it => { const k = it.x.toFixed(4) + ',' + it.y.toFixed(4); if (seen.has(k)) return false; seen.add(k); return true; });
      resultsEl.innerHTML = '';
      if (list.length === 0) {
        const d = document.createElement('div'); d.className = 'empty'; d.textContent = '검색 결과가 없어요';
        resultsEl.appendChild(d);
      } else {
        list.forEach(it => {
          const d = document.createElement('div'); d.className = 'item';
          d.appendChild(document.createTextNode(it.name));
          const sm = document.createElement('small'); sm.textContent = it.sub; d.appendChild(sm);
          d.onclick = () => gotoPlace(it);
          resultsEl.appendChild(d);
        });
      }
      resultsEl.style.display = 'block';
    }

    function gotoPlace(it) {
      const ll = new kakao.maps.LatLng(it.y, it.x);
      if (!destMarker) destMarker = new kakao.maps.Marker({ position: ll, map });
      else { destMarker.setPosition(ll); destMarker.setMap(map); }
      followOn = false; document.getElementById('followBtn').classList.remove('on');
      map.setCenter(ll); map.setLevel(3);
      const box = document.createElement('div');
      box.style.cssText = 'padding:6px 8px;font-size:12px;';
      const b = document.createElement('b'); b.textContent = it.name; box.appendChild(b);
      box.appendChild(document.createElement('br')); box.appendChild(document.createTextNode(it.sub));
      infoWin.setContent(box); infoWin.open(map, destMarker);
      resultsEl.style.display = 'none';
    }

    document.getElementById('searchBtn').onclick = runSearch;
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

    let wakeLock = null;
    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && watchId !== null) requestWakeLock();
    });

    function startTracking() {
      if (!navigator.geolocation) {
        setBanner('danger', '위치 기능 미지원', '이 기기나 브라우저는 위치 기능을 지원하지 않아요', true);
        return;
      }
      if (watchId !== null) return;
      if (location.protocol === 'file:') {
        setBanner('danger', '위치 사용 불가', '파일로 직접 열면 안 돼요. localhost 또는 https 주소로 여세요', true);
        return;
      }
      startWatch(true);
      requestWakeLock();
    }

    const uiBar = document.getElementById('bar'), uiLegend = document.getElementById('legend');
    function placeLegend() { uiLegend.style.bottom = (uiBar.offsetHeight + 14) + 'px'; }
    placeLegend();
    window.addEventListener('resize', placeLegend);
    if (window.ResizeObserver) new ResizeObserver(placeLegend).observe(uiBar);

    document.getElementById('facBtn').onclick = e => {
      facOn = !facOn; e.target.classList.toggle('on', facOn); updateFacilities();
    };
    document.getElementById('followBtn').onclick = e => {
      followOn = !followOn;
      e.target.classList.toggle('on', followOn);
      if (followOn && lastPos && map) map.setCenter(new kakao.maps.LatLng(lastPos[0], lastPos[1]));
    };

    // ===== Windy 기상 지도 =====
    function windyUrl(lat, lng, ov) {
      return 'https://embed.windy.com/embed2.html?lat=' + lat.toFixed(4) + '&lon=' + lng.toFixed(4) +
        '&zoom=10&level=surface&overlay=' + ov + '&menu=&message=&marker=true&calendar=now&pressure=&type=map' +
        '&location=coordinates&detail=&detailLat=' + lat.toFixed(4) + '&detailLon=' + lng.toFixed(4) +
        '&metricWind=default&metricTemp=default&radarRange=-1';
    }
    function loadWindy() {
      let lat = 36.107, lng = 127.488;
      if (lastPos) { lat = lastPos[0]; lng = lastPos[1]; }
      else if (map) { const c = map.getCenter(); lat = c.getLat(); lng = c.getLng(); }
      document.getElementById('windFrame').src = windyUrl(lat, lng, document.getElementById('windOv').value);
    }
    document.getElementById('windBtn').onclick = () => {
      loadWindy();
      document.getElementById('windy').style.display = 'flex';
    };
    document.getElementById('windClose').onclick = () => {
      document.getElementById('windy').style.display = 'none';
      document.getElementById('windFrame').src = 'about:blank';
    };
    document.getElementById('windOv').onchange = loadWindy;

    let satOn = false;
    document.getElementById('satBtn').onclick = e => {
      if (!map) return;
      satOn = !satOn;
      map.setMapTypeId(satOn ? kakao.maps.MapTypeId.HYBRID : kakao.maps.MapTypeId.ROADMAP);
      e.target.classList.toggle('on', satOn);
      e.target.textContent = satOn ? '🗺 일반 지도' : '🛰 위성';
    };

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
